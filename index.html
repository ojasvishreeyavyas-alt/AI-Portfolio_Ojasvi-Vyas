<html lang="en">
<head>

  <title>Ojasvi Vyas | AI and Growth Strategist</title>
  <meta name="description" content="Ideas remain original. Automate what's repetitive! AI Portfolio by Ojasvi Vyas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-page: #fdfbf7;
      --bg-card: #ffffff;
      --bg-subtle: #f5f0e6;
      --bg-dark: #121519;
      --border: #e8e1d5;
      --border-strong: #d5cbb8;
      --text-dark: #18191b;
      --text-teal: #234b5e;
      --text-body: #525860;
      --text-muted: #848a92;
      --accent-gold: #c88a4b;
      --accent-green: #16a34a;
      --accent-green-bg: #dcfce7;
      --accent-blue-bg: #e0f2fe;
      --accent-amber-bg: #fef3c7;
      --accent-amber: #b45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { 
      scroll-behavior: smooth; 
      scroll-padding-top: 96px;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed Top Navbar */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(253, 251, 247, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(24, 25, 27, 0.08);
      padding: 0.85rem 2rem;
    }
    .nav-container {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.55rem;
      color: var(--text-dark);
      text-decoration: none;
    }
    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .nav-links a:not(.btn-nav) {
      color: var(--text-body);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }
    .nav-links a:not(.btn-nav):hover { color: var(--text-dark); }
    .btn-nav {
      background: var(--text-dark);
      color: #fff;
      padding: 0.55rem 1.15rem;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.84rem;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-nav:hover { background: var(--text-teal); transform: translateY(-1px); }

    /* HERO SECTION */
    .hero {
      min-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 7.5rem 1.5rem 5rem 1.5rem;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 82%, rgba(206, 229, 242, 0.85) 0%, rgba(206, 229, 242, 0) 48%),
        radial-gradient(circle at 50% 42%, rgba(251, 232, 206, 0.9) 0%, rgba(253, 251, 247, 0) 65%),
        linear-gradient(180deg, #fbf9f4 0%, #faefe0 55%, #f5f7f9 100%);
      border-bottom: 1px solid var(--border);
    }
    .hero-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }
    .hero-avatar-ring {
      width: 196px;
      height: 196px;
      border-radius: 50%;
      padding: 6px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(24, 25, 27, 0.08);
      margin-bottom: 2.2rem;
    }
    .hero-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .hero-pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      padding: 0.48rem 1.35rem;
      border-radius: 99px;
      background: #ffffff;
      border: 1px solid rgba(24, 25, 27, 0.08);
      color: var(--text-body);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      margin-bottom: 1.75rem;
    }
    .hero h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.4rem, 7.5vw, 5.8rem);
      line-height: 1.03;
      letter-spacing: -0.015em;
      color: var(--text-dark);
      margin-bottom: 1.75rem;
    }
    .hero h1 .italic-teal {
      font-style: italic;
      color: var(--text-teal);
      display: block;
    }
    .hero-subtitle {
      font-size: 1.08rem;
      color: var(--text-body);
      max-width: 580px;
      line-height: 1.65;
      margin-bottom: 2.25rem;
      font-weight: 400;
    }
    .hero-cta-row {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      background: var(--text-dark);
      color: #ffffff;
      padding: 0.8rem 1.6rem;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 24px rgba(24, 25, 27, 0.12);
      transition: all 0.2s;
    }
    .btn-primary:hover { background: var(--text-teal); transform: translateY(-2px); }
    .btn-secondary {
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid var(--border-strong);
      padding: 0.8rem 1.6rem;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-subtle); }

    /* MAIN CONTAINER */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 5rem 1.5rem 6rem 1.5rem;
    }
    .section-head {
      text-align: center;
      margin-bottom: 4rem;
    }
    .section-head span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent-gold);
      font-weight: 600;
    }
    .section-head h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(2.4rem, 4.5vw, 3.5rem);
      font-weight: 400;
      color: var(--text-dark);
      margin-top: 0.35rem;
    }

    /* PROJECT SHOWCASE CARDS */
    .projects-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4.5rem;
    }
    .project-card {
      scroll-margin-top: 100px;

      border: 1px solid var(--border);
